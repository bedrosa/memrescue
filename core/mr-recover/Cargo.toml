[package]
name = "mr-recover"
description = "Motor de recuperación de MemRescue: copia de ficheros y directorios del árbol virtual a un destino seguro con diario por fichero"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
mr-common.workspace = true
mr-io.workspace = true
mr-fs-ntfs.workspace = true
mr-vfs.workspace = true

[dev-dependencies]
# Las pruebas de integración usan la vía real de escritura (`mr_api::create_output`) a través de
# `mr_api::recover`; `mr-api` depende de este crate (ciclo solo de desarrollo, admitido por Cargo).
mr-api.workspace = true
mr-fs-ntfs = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
