[workspace]
resolver = "2"
members = [
    "core/mr-common",
    "core/mr-io",
    "core/mr-store",
    "core/mr-api",
    "core/mr-ffi",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-MemRescue-Proprietary"
authors = ["MemRescue"]
rust-version = "1.80"

[workspace.dependencies]
mr-common = { path = "core/mr-common" }
mr-io = { path = "core/mr-io" }
mr-store = { path = "core/mr-store" }
mr-api = { path = "core/mr-api" }
thiserror = "2"
crc32fast = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
lto = "thin"
